// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        maven { url 'https://maven.google.com' }
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        maven { url 'https://maven.google.com' }
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy {
            force 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
            force 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.3'
            force 'androidx.lifecycle:lifecycle-common-java8:2.8.3'
            force 'androidx.window:window:1.3.0'
            force 'com.google.firebase:firebase-annotations:16.2.0'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
