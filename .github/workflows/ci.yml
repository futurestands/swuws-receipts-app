name: SWUWS Enterprise CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      production-test-db:
        image: postgres:17
        env:
          POSTGRES_USER: swuws_test
          POSTGRES_PASSWORD: disposable-test-only
          POSTGRES_DB: swuws_production_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swuws_test -d swuws_production_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security Audit (Secrets Check)
        run: |
          # .env.example files document the key name. Fail only if a real
          # assignment is committed outside those templates.
          if git grep -n -E '^[[:space:]]*(export[[:space:]]+)?BETTER_AUTH_SECRET[[:space:]]*=' -- ':!.env.example' ':!.env.production.example' ':!*.md'; then
            echo "CRITICAL SECURITY ERROR: BETTER_AUTH_SECRET assigned outside example files"
            exit 1
          fi
          echo "No committed BETTER_AUTH_SECRET assignments outside examples."

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      - name: Unit Tests (Math & Logic)
        run: npm test

      - name: Production integrity integration tests (disposable database only)
        run: npx vitest run lib/production/integrity.integration.test.ts --no-cache
        env:
          SWUWS_PRODUCTION_INTEGRATION: '1'
          PRODUCTION_TEST_DATABASE_URL: postgres://swuws_test:disposable-test-only@127.0.0.1:5432/swuws_production_test
          DATABASE_URL: postgres://dummy:unused@127.0.0.1:5432/unused

      - name: Production Build
        run: npm run build
        env:
          DATABASE_URL: postgres://dummy:password@localhost:5432/db
          BETTER_AUTH_SECRET: dummy-secret
          BETTER_AUTH_URL: https://swuws-test.invalid
          NEXT_PUBLIC_APP_URL: https://swuws-test.invalid
